<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-shell detail-shell">
        <a class="back-link" href="/logout">Uitloggen</a>

        <section class="hero">
            <p class="eyebrow">GPS Asset Tracker</p>
            <h1>Grafana dashboard</h1>
            <p class="intro">
                Live overzicht van trackerdata, MQTT-status en assetlocaties.
            </p>
        </section>

        <section class="detail-card grafana-preview" aria-label="Grafana dashboard">
            <div class="card-top">
                <span class="chip">Grafana live</span>
                <span class="year">MQTT</span>
            </div>

            <h2>Tracker monitoring</h2>
            <ul class="meta-list">
                <li><span>Laatste locatie</span><strong>Via Grafana</strong></li>
                <li><span>Signaal</span><strong>Via Grafana</strong></li>
                <li><span>Batterij</span><strong>Via Grafana</strong></li>
            </ul>

            <div class="grafana-frame-wrap dashboard-frame">
                <iframe
                    title="Grafana GPS tracker dashboard"
                    src="https://play.grafana.org/d/000000012/grafana-play-home?orgId=1&kiosk"
                    loading="lazy">
                </iframe>
            </div>

            <div class="detail-actions">
                <a href="https://play.grafana.org/" target="_blank" rel="noreferrer">Open Grafana</a>
            </div>
        </section>
    </main>
</body>
</html>
